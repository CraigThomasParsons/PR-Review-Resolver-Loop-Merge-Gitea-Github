name: Label a brand-new PR for the review loop

# Cuts the latency between opening a PR and review:requested landing on it
# from "up to an hour" (pr-pipeline.timer's cadence) to seconds.
#
# Scope is deliberately narrow: this only ever touches a PR that carries NO
# review:* or agent:* label yet, i.e. one the pipeline has genuinely never
# seen. Every other decision (refreshing a stale verdict after a new head,
# granting review:automerge, handling review:needs-human/night:hold) stays
# with TheNightCrew's LabelPullRequests action (php artisan nightcrew:label-prs,
# still running hourly via pr-pipeline.timer) so there is exactly one place
# that owns those rules, not two that can disagree.
#
# No checkout step on purpose: the job container (factory-node) is isolated
# with no host bind mounts, and this only needs to call the Gitea API, so the
# script is inlined below rather than pulled from the repo -- one less moving
# part (no dependency on actions/checkout resolving) for a script this small.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  label-new-pr:
    runs-on: factory-node
    steps:
      - name: Add review:requested if this PR has never been labelled
        env:
          GITEA_API_URL: ${{ gitea.server_url }}/api/v1
          REPO: ${{ gitea.repository }}
          PR_NUMBER: ${{ gitea.event.pull_request.number }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_DRAFT: ${{ gitea.event.pull_request.draft }}
          AUTHOR_LOGIN: ${{ gitea.event.pull_request.user.login }}
          PR_TITLE: ${{ gitea.event.pull_request.title }}
          EXISTING_LABELS: ${{ toJSON(gitea.event.pull_request.labels) }}
        run: |
          cat > /tmp/label-new-pr.js <<'JS_EOF'
          // Mirrors the exact bot/skip criteria skills/pr-loops-common/gitea-pr.py
          // and pr-loop.sh already use, so this agrees with the rest of the
          // pipeline on what counts as a PR worth touching.
          const BOT_LOGINS = new Set(["gitea-actions", "actions-user"]);
          const SKIP_TITLE_PATTERN = /docblock-backfill|^chore\(#152\)/;
          const REQUESTED_LABEL = "review:requested";

          function skip(reason) {
            console.log(`skip: ${reason}`);
            process.exit(0);
          }

          async function main() {
            const { GITEA_API_URL, REPO, PR_NUMBER, TOKEN, IS_DRAFT, AUTHOR_LOGIN, PR_TITLE, EXISTING_LABELS } = process.env;

            if (IS_DRAFT === "true") skip("draft PR");

            const login = (AUTHOR_LOGIN || "").toLowerCase();
            if (BOT_LOGINS.has(login) || login.endsWith("[bot]")) skip(`bot author ${AUTHOR_LOGIN}`);

            if (SKIP_TITLE_PATTERN.test(PR_TITLE || "")) skip(`title matches the skip pattern: ${PR_TITLE}`);

            const existing = JSON.parse(EXISTING_LABELS || "[]").map((l) => l.name);
            if (existing.some((name) => name.startsWith("review:") || name.startsWith("agent:"))) {
              skip(`already labelled (${existing.join(", ")}); the pipeline already knows about this PR`);
            }

            const headers = { Authorization: `token ${TOKEN}`, "Content-Type": "application/json" };

            const labelsResp = await fetch(`${GITEA_API_URL}/repos/${REPO}/labels?limit=50`, { headers });
            if (!labelsResp.ok) {
              throw new Error(`listing labels failed: ${labelsResp.status} ${await labelsResp.text()}`);
            }
            const labels = await labelsResp.json();
            const requested = labels.find((l) => l.name === REQUESTED_LABEL);
            if (!requested) {
              throw new Error(`repo has no "${REQUESTED_LABEL}" label defined -- run the label roller first`);
            }

            const addResp = await fetch(`${GITEA_API_URL}/repos/${REPO}/issues/${PR_NUMBER}/labels`, {
              method: "POST",
              headers,
              body: JSON.stringify({ labels: [requested.id] }),
            });
            if (!addResp.ok) {
              throw new Error(`adding ${REQUESTED_LABEL} failed: ${addResp.status} ${await addResp.text()}`);
            }
            console.log(`added ${REQUESTED_LABEL} to #${PR_NUMBER}`);
          }

          main().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          JS_EOF
          node /tmp/label-new-pr.js
